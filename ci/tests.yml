# Regression test definitions for svd2odin
#
# Each test specifies a chip, manufacturer, and SVD URL.
# The regression script downloads the SVD, generates Odin code,
# and verifies it compiles with `odin build`.
#
# SVD files are sourced from the CMSIS-SVD repository:
#   https://github.com/cmsis-svd/cmsis-svd-data

# ── STMicro ──
- arch: cortex-m
  mfgr: STMicro
  chip: STM32F030
  svd_url: https://raw.githubusercontent.com/cmsis-svd/cmsis-svd-data/main/data/STMicro/STM32F030.svd

